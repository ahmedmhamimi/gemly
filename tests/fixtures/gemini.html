<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Trip plan - Google Gemini</title>
<style>
  html,body{margin:0;height:100%;font-family:Roboto,Arial,sans-serif;font-size:14px}
  body.dark-theme{background:#131314;color:#e3e3e3} body.light-theme{background:#fff;color:#1f1f1f}
  chat-app{display:flex;height:100vh}
  bard-sidenav{width:300px;flex:none;background:#1e1f20;overflow:auto;padding:8px}
  .light-theme bard-sidenav{background:#f0f4f9}
  .conversation-container.row{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 8px;border-radius:20px}
  .conversation-container.row:hover{background:#333}
  a.conversation{color:inherit;text-decoration:none;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  infinite-scroller{flex:1;overflow:auto;display:block;padding:24px 0}
  .turn-wrap{max-width:760px;margin:0 auto;padding:0 16px}
  user-query{display:block;margin:16px 0;padding:14px 20px;border-radius:24px;background:#282a2c;width:fit-content;max-width:80%;margin-left:auto}
  model-response{display:block;margin:16px 0}
  input-area-v2{display:block;padding:0 16px 16px}
  .input-area-container{max-width:760px;margin:0 auto;border-radius:28px;background:#1e1f20;padding:12px 16px}
  .ql-editor{min-height:28px;outline:none}
  .ql-editor.ql-blank::before{content:"Ask Gemini";opacity:.5}
  .trailing{display:flex;justify-content:flex-end}
  button.send-button{border:0;border-radius:50%;width:40px;height:40px}
  message-actions .buttons{display:flex;gap:4px;align-items:center}
  message-actions button{width:34px;height:34px;border-radius:50%;border:0;background:none;color:inherit}
  code-block pre{background:#0d0d0d;padding:8px;border-radius:8px;overflow:auto}
  table{border-collapse:collapse} td,th{border:1px solid #555;padding:4px 8px}
</style></head>
<body class="dark-theme">
<chat-app>
<bard-sidenav><side-navigation-content>
  <conversations-list><div class="conversations-container"><div class="title-container"><h1>Chats</h1></div>
   <div class="conversation-items-container" id="rows">
    <div data-test-id="conversation" class="conversation-container row"><a class="conversation" href="/app/abc123def456"><div class="conversation-title">Trip plan</div></a><button class="conversation-actions-menu-button" aria-label="Open menu for conversation actions">⋮</button></div>
    <div data-test-id="conversation" class="conversation-container row"><a class="conversation" href="/app/zzz999yyy888"><div class="conversation-title">Recipe ideas</div></a><button class="conversation-actions-menu-button">⋮</button></div>
    <div data-test-id="conversation" class="conversation-container row"><a class="conversation" href="/u/1/gem/gem1/ggg111hhh222"><div class="conversation-title">Gem chat</div></a></div>
   </div></div></conversations-list>
</side-navigation-content></bard-sidenav>
<main>
 <infinite-scroller class="chat-history"><div class="turn-wrap" id="turns">
  <div class="conversation-container">
   <user-query><span class="cdk-visually-hidden">You said</span><div class="query-text"><p class="query-text-line">Plan a trip to Cairo</p><p class="query-text-line">for 3 days</p></div><button aria-label="Edit text" style="display:none">e</button></user-query>
   <model-response><message-content><div class="markdown markdown-main-panel">
     <p>Here is a <strong>pl</strong>an with <code>code</code> and a <a href="https://example.com">link</a><source-footnote>1</source-footnote>.</p>
     <ul><li>Day 1: Pyramids</li><li>Day 2: <em>Museum</em><ul><li>Nested</li></ul></li></ul>
     <code-block><div class="code-block-decoration"><span>python</span></div><pre><code>print("hi")</code></pre></code-block>
     <table-block><table><tr><th>A</th><th>B</th></tr><tr><td>1</td><td>2</td></tr></table></table-block>
     <p>مرحبا بالعالم İstanbul</p>
   </div></message-content>
   <message-actions><div class="buttons"><thumb-up-button><button aria-label="Good response">👍</button></thumb-up-button><copy-button><button aria-label="Copy">⧉</button></copy-button></div></message-actions></model-response>
  </div>
 </div></infinite-scroller>
 <input-area-v2><div class="input-area-container"><rich-textarea><div class="ql-editor ql-blank" contenteditable="true" role="textbox"><p><br></p></div></rich-textarea>
  <div class="trailing"><button class="send-button" aria-label="Send message">➤</button></div></div></input-area-v2>
</main></chat-app>
</body></html>
